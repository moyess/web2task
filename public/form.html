<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="提交任务到滴答清单">
  <title>提交任务 · 滴答清单</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <nav class="navbar">
      <div class="navbar-content">
        <div class="navbar-brand">
          <div class="brand-icon-small"></div>
          <span class="navbar-title">任务提交系统</span>
        </div>
        <button id="reauthBtn" class="icon-button" title="重新授权">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </nav>

    <main class="main-container">
      <div id="authWarning" class="alert-card" style="display: none;">
        <div class="alert-icon">⚠</div>
        <div class="alert-content">
          <div class="alert-title">需要授权</div>
          <div class="alert-message">请先完成授权后再提交任务</div>
          <a href="/" class="alert-link">前往授权 →</a>
        </div>
      </div>

      <div class="content-grid">
        <!-- 左侧：统计信息 -->
        <aside class="sidebar">
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
              </div>
              <div class="stat-label">快速提交</div>
            </div>
            <div class="stat-value">高效协作</div>
            <div class="stat-desc">一键同步到滴答清单</div>
          </div>

          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="9" y1="9" x2="15" y2="9"></line>
                  <line x1="9" y1="15" x2="15" y2="15"></line>
                </svg>
              </div>
              <div class="stat-label">任务管理</div>
            </div>
            <div class="stat-value">自动同步</div>
            <div class="stat-desc">实时更新任务状态</div>
          </div>
        </aside>

        <!-- 右侧：表单 -->
        <div class="form-section">
          <form id="taskForm" class="task-form-card">
            <div class="form-header">
              <h2 class="form-title">创建新任务</h2>
              <p class="form-subtitle">填写任务详细信息</p>
            </div>

            <div class="form-body">
              <div class="form-group">
                <label class="form-label">
                  任务标题
                  <span class="required">*</span>
                </label>
                <input
                  type="text"
                  id="title"
                  name="title"
                  class="form-input"
                  placeholder="例如：完成季度报告"
                  required
                  autocomplete="off"
                >
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">优先级</label>
                  <select id="priority" name="priority" class="form-select">
                    <option value="0">无</option>
                    <option value="1">低</option>
                    <option value="3">中</option>
                    <option value="5" selected>高</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label">截止日期</label>
                  <input
                    type="date"
                    id="dueDate"
                    name="dueDate"
                    class="form-input"
                  >
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">任务描述</label>
                <textarea
                  id="content"
                  name="content"
                  class="form-textarea"
                  rows="4"
                  placeholder="详细描述任务内容和要求..."
                ></textarea>
              </div>
            </div>

            <div class="form-footer">
              <button type="submit" class="submit-button" id="submitBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>提交任务</span>
              </button>
            </div>
          </form>

          <div id="message" class="message-toast"></div>
        </div>
      </div>
    </main>

    <footer class="page-footer">
      <p>任务将自动同步至滴答清单 · 支持快捷键 Ctrl+Enter 提交</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
