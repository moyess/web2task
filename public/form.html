<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="提交任务到滴答清单">
  <title>提交任务 · 滴答清单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    }
  </style>
</head>
<body class="bg-white antialiased">
  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="text-lg font-semibold text-black">任务提交</span>
        </div>
        <button id="reauthBtn" class="p-2 text-gray-500 hover:text-black transition-colors" title="重新授权">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <!-- Warning -->
    <div id="authWarning" class="mb-8 p-6 bg-gray-50 border border-gray-200 rounded-2xl" style="display: none;">
      <div class="flex items-start space-x-3">
        <svg class="w-6 h-6 text-gray-900 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <div class="flex-1">
          <h3 class="font-medium text-black mb-1">需要授权</h3>
          <p class="text-sm text-gray-500 mb-3">请先完成授权后再提交任务</p>
          <a href="/" class="inline-flex items-center text-sm font-medium text-black hover:text-gray-700">
            前往授权
            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="mb-8">
      <h1 class="text-5xl font-semibold tracking-tight text-black mb-4">创建新任务</h1>
      <p class="text-xl text-gray-500">填写任务详细信息</p>
    </div>

    <form id="taskForm" class="space-y-8">
      <!-- Title -->
      <div>
        <label for="title" class="block text-sm font-medium text-black mb-3">
          任务标题 <span class="text-gray-400">*</span>
        </label>
        <input
          type="text"
          id="title"
          name="title"
          class="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition-all text-black placeholder-gray-400"
          placeholder="例如：完成季度报告"
          required
          autocomplete="off"
        >
      </div>

      <!-- Priority & Date -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="priority" class="block text-sm font-medium text-black mb-3">
            优先级
          </label>
          <select
            id="priority"
            name="priority"
            class="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition-all text-black appearance-none cursor-pointer"
            style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 fill=%22none%22 viewBox=%220 0 24 24%22 stroke=%22%23000%22%3E%3Cpath stroke-linecap=%22round%22 stroke-linejoin=%22round%22 stroke-width=%222%22 d=%22M19 9l-7 7-7-7%22/%3E%3C/svg%3E'); background-position: right 1rem center; background-repeat: no-repeat; background-size: 1.25rem; padding-right: 3rem;"
          >
            <option value="0">无</option>
            <option value="1">低</option>
            <option value="3">中</option>
            <option value="5" selected>高</option>
          </select>
        </div>

        <div>
          <label for="dueDate" class="block text-sm font-medium text-black mb-3">
            截止日期
          </label>
          <input
            type="date"
            id="dueDate"
            name="dueDate"
            class="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition-all text-black"
          >
        </div>
      </div>

      <!-- Description -->
      <div>
        <label for="content" class="block text-sm font-medium text-black mb-3">
          任务描述
        </label>
        <textarea
          id="content"
          name="content"
          rows="5"
          class="w-full px-4 py-3.5 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition-all text-black placeholder-gray-400 resize-none"
          placeholder="详细描述任务内容和要求..."
        ></textarea>
      </div>

      <!-- Submit Button -->
      <div class="pt-4">
        <button
          type="submit"
          id="submitBtn"
          class="w-full py-4 px-6 bg-black text-white text-center rounded-full font-medium hover:bg-gray-900 transition-all transform hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
        >
          提交任务
        </button>
      </div>
    </form>

    <!-- Message -->
    <div id="message" class="mt-6 p-4 rounded-xl hidden"></div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 mt-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <p class="text-center text-sm text-gray-400">
        任务将自动同步至滴答清单 · 快捷键 ⌘ + Enter 提交
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
