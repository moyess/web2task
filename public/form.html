<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit tasks to Dida365">
  <title>Submit Task · Dida365</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <header class="header">
      <div class="header-content">
        <div class="logo-small">
          <div class="logo-icon-small"></div>
          <span class="logo-text">Task Submission</span>
        </div>
        <button id="reauthBtn" class="reauth-button" title="Re-authorize">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <div id="authWarning" class="warning-card" style="display: none;">
        <p class="warning-text">Authorization required to proceed</p>
        <a href="/" class="warning-link">Go to authorization</a>
      </div>

      <form id="taskForm" class="task-form">
        <div class="form-header">
          <h1 class="form-title">New Task</h1>
          <div class="title-underline"></div>
        </div>

        <div class="form-body">
          <div class="form-field">
            <label class="field-label">
              Task Title
              <span class="required-mark">*</span>
            </label>
            <input
              type="text"
              id="title"
              name="title"
              class="field-input"
              placeholder="Enter task title"
              required
              autocomplete="off"
            >
          </div>

          <div class="form-row">
            <div class="form-field form-field-half">
              <label class="field-label">Priority Level</label>
              <div class="select-wrapper">
                <select id="priority" name="priority" class="field-select">
                  <option value="0">None</option>
                  <option value="1">Low</option>
                  <option value="3">Medium</option>
                  <option value="5" selected>High</option>
                </select>
              </div>
            </div>

            <div class="form-field form-field-half">
              <label class="field-label">Due Date</label>
              <input
                type="date"
                id="dueDate"
                name="dueDate"
                class="field-input"
              >
            </div>
          </div>

          <div class="form-field">
            <label class="field-label">Description</label>
            <textarea
              id="content"
              name="content"
              class="field-textarea"
              rows="4"
              placeholder="Provide detailed task description"
            ></textarea>
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" class="submit-button" id="submitBtn">
            <span>Submit Task</span>
            <span class="button-arrow">→</span>
          </button>
        </div>
      </form>

      <div id="message" class="message-box"></div>
    </main>

    <footer class="footer">
      <p class="footer-text">Tasks will be automatically synced to Dida365</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
