<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="滴答清单协作任务提交系统 - 让团队协作更高效">
  <title>滴答清单协作 - 授权</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <h1>✓ 滴答清单协作系统</h1>
      <p class="description">让团队协作更简单高效</p>
      <p class="description">首次使用需要授权访问您的滴答清单账户</p>

      <div class="auth-info">
        <h3>📋 快速开始</h3>
        <ol>
          <li>点击下方"开始授权"按钮</li>
          <li>在滴答清单登录页面完成身份验证</li>
          <li>同意应用访问权限</li>
          <li>授权成功后即可开始接收团队任务</li>
        </ol>
      </div>

      <a href="/auth" class="auth-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        开始授权
      </a>

      <p class="note">🔒 安全提示：我们使用 OAuth 2.0 标准协议，确保您的账户安全。授权后，团队成员可以通过此系统向您的清单提交任务。</p>
    </div>
  </div>
</body>
</html>
