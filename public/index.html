<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滴答清单协作 - 授权</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <h1>滴答清单协作系统</h1>
      <p class="description">欢迎使用滴答清单协作任务提交系统</p>
      <p class="description">首次使用需要授权访问您的滴答清单</p>

      <div class="auth-info">
        <h3>使用说明：</h3>
        <ol>
          <li>点击下方按钮进行授权</li>
          <li>在滴答清单页面登录并同意授权</li>
          <li>授权成功后即可提交任务</li>
        </ol>
      </div>

      <a href="/auth" class="auth-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        开始授权
      </a>

      <p class="note">授权后，您的同事可以通过此系统向您的滴答清单提交任务</p>
    </div>
  </div>
</body>
</html>
