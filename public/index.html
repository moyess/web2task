<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="滴答清单协作任务提交系统">
  <title>任务提交 · 滴答清单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    }
  </style>
</head>
<body class="bg-white antialiased">
  <div class="min-h-screen flex items-center justify-center px-4 py-16">
    <div class="max-w-md w-full">
      <!-- Logo -->
      <div class="text-center mb-12">
        <svg class="w-12 h-12 mx-auto mb-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h1 class="text-4xl font-semibold tracking-tight text-black mb-2">任务协作系统</h1>
        <p class="text-base text-gray-500">滴答清单集成</p>
      </div>

      <!-- Steps -->
      <div class="space-y-3 mb-12">
        <div class="flex items-start space-x-4 p-5 bg-gray-50 rounded-2xl hover:bg-gray-100 transition-colors">
          <div class="flex-shrink-0 w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-sm font-medium">1</div>
          <div>
            <h3 class="font-medium text-black mb-1">点击授权</h3>
            <p class="text-sm text-gray-500">开始 OAuth 认证流程</p>
          </div>
        </div>

        <div class="flex items-start space-x-4 p-5 bg-gray-50 rounded-2xl hover:bg-gray-100 transition-colors">
          <div class="flex-shrink-0 w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-sm font-medium">2</div>
          <div>
            <h3 class="font-medium text-black mb-1">登录账户</h3>
            <p class="text-sm text-gray-500">使用滴答清单账号登录</p>
          </div>
        </div>

        <div class="flex items-start space-x-4 p-5 bg-gray-50 rounded-2xl hover:bg-gray-100 transition-colors">
          <div class="flex-shrink-0 w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-sm font-medium">3</div>
          <div>
            <h3 class="font-medium text-black mb-1">授予权限</h3>
            <p class="text-sm text-gray-500">允许访问您的任务列表</p>
          </div>
        </div>
      </div>

      <!-- Button -->
      <a href="/auth" class="block w-full py-4 px-6 bg-black text-white text-center rounded-full font-medium hover:bg-gray-900 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
        开始授权
      </a>

      <!-- Footer Note -->
      <p class="text-center text-xs text-gray-400 mt-8">
        采用 OAuth 2.0 安全协议
      </p>
    </div>
  </div>
</body>
</html>
