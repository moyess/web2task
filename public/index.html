<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="滴答清单协作任务提交系统">
  <title>Task Submission · Dida365</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-content">
      <div class="logo">
        <div class="logo-icon"></div>
      </div>

      <h1 class="auth-title">Task Collaboration</h1>
      <p class="auth-subtitle">Dida365 Integration System</p>

      <div class="auth-divider"></div>

      <div class="auth-steps">
        <div class="step">
          <span class="step-number">01</span>
          <span class="step-text">Click authorization button</span>
        </div>
        <div class="step">
          <span class="step-number">02</span>
          <span class="step-text">Login to Dida365 account</span>
        </div>
        <div class="step">
          <span class="step-number">03</span>
          <span class="step-text">Grant access permission</span>
        </div>
      </div>

      <a href="/auth" class="auth-button">
        <span>Begin Authorization</span>
        <span class="button-arrow">→</span>
      </a>

      <p class="auth-note">Secured by OAuth 2.0 protocol</p>
    </div>
  </div>
</body>
</html>
